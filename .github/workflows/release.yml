name: Release

# Batched release cadence.
#
# release-please runs on a fixed daily window instead of on every push to main,
# so a single version carries every feat/fix merged since the previous tag
# rather than one version per merge. `workflow_dispatch` stays available as the
# emergency release and asset-backfill channel.
#
# release-please creates tags from merged-but-untagged release PRs, so the
# GitHub Release is cut on the first window after the release PR is merged
# instead of on the merge push itself.
on:
  schedule:
    # 03:07 UTC daily. Deliberately off the hour: GitHub queues scheduled
    # runs and on-the-hour crons are the most delayed during peak load.
    # CONTRACT: this window stays AFTER the dcc-mcp-core release window
    # (01:13 UTC) so a release never packages a stale core.
    - cron: "07 3 * * *"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for manual asset build, for example v0.1.0. Leave empty to only run release-please."
        required: false
        default: ""
      publish_to_pypi:
        description: "Publish rebuilt dist artifacts for tag_name to PyPI. Use to backfill an existing GitHub release."
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}${{ inputs.tag_name && format('-{0}', inputs.tag_name) || '' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.target.outputs.tag_name }}
      tag_sha: ${{ steps.target.outputs.tag_sha }}
      version: ${{ steps.target.outputs.version }}
    steps:
      # A PAT (user-owned) is required: PRs opened with the default
      # GITHUB_TOKEN do not trigger pull_request workflows, so CI would never
      # run on release PRs.
      - uses: googleapis/release-please-action@v5
        id: release
        # On an explicit dispatch target the requested tag is authoritative.
        # Running release-please here can create a new release whose tag then
        # silently wins over the requested one in RELEASE_TAG below, so the
        # operator asking to backfill v0.1.5 would get v0.1.6 published instead.
        if: github.event_name != 'workflow_dispatch' || inputs.tag_name == ''
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Resolve immutable release target
        id: target
        if: steps.release.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name || inputs.tag_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release target must be a canonical vMAJOR.MINOR.PATCH tag." >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          if [[ -n "$RELEASE_VERSION" && "$RELEASE_VERSION" != "$version" ]]; then
            echo "Release Please version does not match its tag." >&2
            exit 1
          fi
          object_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq .object.type)"
          object_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq .object.sha)"
          for _ in 1 2 3 4; do
            if [[ "$object_type" == "commit" ]]; then
              break
            fi
            if [[ "$object_type" != "tag" ]]; then
              echo "Release tag does not resolve to a commit." >&2
              exit 1
            fi
            tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")"
            object_type="$(jq -r .object.type <<<"$tag_json")"
            object_sha="$(jq -r .object.sha <<<"$tag_json")"
          done
          if [[ "$object_type" != "commit" || ! "$object_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release tag commit identity is invalid." >&2
            exit 1
          fi
          echo "tag_name=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "tag_sha=$object_sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      - name: Verify immutable release target
        env:
          EXPECTED_TAG: ${{ needs.release-please.outputs.tag_name }}
          EXPECTED_SHA: ${{ needs.release-please.outputs.tag_sha }}
          EXPECTED_VERSION: ${{ needs.release-please.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-parse "${EXPECTED_TAG}^{commit}")"
          if [[ "$actual_sha" != "$EXPECTED_SHA" || "$tag_sha" != "$EXPECTED_SHA" ]]; then
            echo "Checked-out release identity does not match the resolved tag." >&2
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          expected = os.environ["EXPECTED_VERSION"]
          manifest = json.loads(Path(".release-please-manifest.json").read_text(encoding="utf-8"))["."]
          source = Path("pyproject.toml").read_text(encoding="utf-8")
          match = re.search(r'^version = "([0-9]+\.[0-9]+\.[0-9]+)"', source, re.MULTILINE)
          if match is None or manifest != expected or match.group(1) != expected:
              raise SystemExit("Checked-out package version does not match the release target.")
          PY
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine
      - name: Build package
        run: python -m build
      - name: Check package
        run: python -m twine check dist/*
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '' && inputs.publish_to_pypi == true)
    environment:
      name: pypi
      url: https://pypi.org/p/dcc-mcp-marvelous-designer
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      - name: Verify immutable release target
        env:
          EXPECTED_TAG: ${{ needs.release-please.outputs.tag_name }}
          EXPECTED_SHA: ${{ needs.release-please.outputs.tag_sha }}
          EXPECTED_VERSION: ${{ needs.release-please.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-parse "${EXPECTED_TAG}^{commit}")"
          if [[ "$actual_sha" != "$EXPECTED_SHA" || "$tag_sha" != "$EXPECTED_SHA" ]]; then
            echo "Checked-out release identity does not match the resolved tag." >&2
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          expected = os.environ["EXPECTED_VERSION"]
          manifest = json.loads(Path(".release-please-manifest.json").read_text(encoding="utf-8"))["."]
          source = Path("pyproject.toml").read_text(encoding="utf-8")
          match = re.search(r'^version = "([0-9]+\.[0-9]+\.[0-9]+)"', source, re.MULTILINE)
          if match is None or manifest != expected or match.group(1) != expected:
              raise SystemExit("Checked-out package version does not match the release target.")
          PY
      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          verbose: true
          print-hash: true

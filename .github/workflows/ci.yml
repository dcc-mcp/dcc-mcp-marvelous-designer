name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .[test] build
      - run: python -m pytest -q
        env:
          DCC_MCP_DISABLE_DEFAULT_SKILL_PATHS: '1'
      - run: python -m build
  python37-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -c "import ast,pathlib; [ast.parse(p.read_text(),feature_version=(3,7)) for p in pathlib.Path('src').rglob('*.py')]"
